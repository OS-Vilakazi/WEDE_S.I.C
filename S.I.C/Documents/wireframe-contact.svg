<svg width="800" height="750" viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="750" fill="#ffffff" stroke="#ccc"/>
  <text x="400" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">Wireframe — Contact Page (Low-Fidelity)</text>

  <!-- Header / Nav -->
  <rect x="30" y="50" width="740" height="60" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="45" y="65" width="70" height="30" fill="none" stroke="#333"/>
  <text x="80" y="84" font-size="10" text-anchor="middle" fill="#333">LOGO</text>
  <line x1="180" y1="80" x2="250" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="270" y1="80" x2="340" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="360" y1="80" x2="430" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="450" y1="80" x2="520" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="540" y1="80" x2="610" y2="80" stroke="#999" stroke-width="6"/>

  <!-- Page header -->
  <rect x="30" y="130" width="740" height="90" fill="#eee" stroke="#333"/>
  <line x1="55" y1="160" x2="300" y2="160" stroke="#333" stroke-width="8"/>
  <line x1="55" y1="185" x2="420" y2="185" stroke="#999" stroke-width="4"/>

  <!-- 3 location cards -->
  <rect x="30" y="245" width="230" height="150" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="285" y="245" width="230" height="150" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="540" y="245" width="230" height="150" fill="none" stroke="#333" stroke-width="1.5"/>
  <g font-size="9" fill="#999">
    <text x="145" y="270" text-anchor="middle">location name</text>
    <text x="400" y="270" text-anchor="middle">location name</text>
    <text x="655" y="270" text-anchor="middle">location name</text>
  </g>
  <rect x="45" y="330" width="200" height="50" fill="#f5f5f5" stroke="#999" stroke-dasharray="3"/>
  <rect x="300" y="330" width="200" height="50" fill="#f5f5f5" stroke="#999" stroke-dasharray="3"/>
  <rect x="555" y="330" width="200" height="50" fill="#f5f5f5" stroke="#999" stroke-dasharray="3"/>
  <text x="145" y="358" font-size="8" text-anchor="middle" fill="#999">map placeholder</text>
  <text x="400" y="358" font-size="8" text-anchor="middle" fill="#999">map placeholder</text>
  <text x="655" y="358" font-size="8" text-anchor="middle" fill="#999">map placeholder</text>

  <!-- Contact form section -->
  <line x1="30" y1="430" x2="220" y2="430" stroke="#333" stroke-width="6"/>
  <line x1="30" y1="455" x2="380" y2="455" stroke="#999" stroke-width="4"/>

  <rect x="30" y="480" width="740" height="230" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="55" y="505" width="300" height="24" fill="none" stroke="#999"/>
  <rect x="55" y="545" width="300" height="24" fill="none" stroke="#999"/>
  <rect x="55" y="585" width="300" height="80" fill="none" stroke="#999"/>
  <rect x="55" y="680" width="120" height="24" fill="none" stroke="#333"/>
  <text x="115" y="696" font-size="9" text-anchor="middle" fill="#333">[ SEND ]</text>
  <g font-size="8" fill="#999">
    <text x="60" y="500">name</text>
    <text x="60" y="540">email</text>
    <text x="60" y="580">message</text>
  </g>

  <!-- Footer -->
  <rect x="30" y="720" width="740" height="20" fill="#eee" stroke="#333"/>
  <text x="400" y="734" font-size="9" text-anchor="middle" fill="#666">footer</text>
</svg>
