<svg width="800" height="900" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="900" fill="#ffffff" stroke="#ccc"/>
  <text x="400" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">Wireframe — Homepage (Low-Fidelity)</text>

  <!-- Header / Nav -->
  <rect x="30" y="50" width="740" height="60" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="45" y="65" width="70" height="30" fill="none" stroke="#333"/>
  <text x="80" y="84" font-size="10" text-anchor="middle" fill="#333">LOGO</text>
  <line x1="180" y1="80" x2="250" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="270" y1="80" x2="340" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="360" y1="80" x2="430" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="450" y1="80" x2="520" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="540" y1="80" x2="610" y2="80" stroke="#999" stroke-width="6"/>
  <text x="670" y="84" font-size="9" text-anchor="middle" fill="#999">nav links</text>

  <!-- Ticker -->
  <rect x="30" y="118" width="740" height="24" fill="#eee" stroke="#333"/>
  <text x="400" y="134" font-size="9" text-anchor="middle" fill="#666">scrolling fixture ticker</text>

  <!-- Hero -->
  <rect x="30" y="150" width="740" height="220" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="185" x2="330" y2="185" stroke="#333" stroke-width="10"/>
  <line x1="55" y1="215" x2="300" y2="215" stroke="#333" stroke-width="10"/>
  <line x1="55" y1="250" x2="420" y2="250" stroke="#999" stroke-width="4"/>
  <line x1="55" y1="270" x2="380" y2="270" stroke="#999" stroke-width="4"/>
  <rect x="55" y="300" width="160" height="34" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="135" y="321" font-size="10" text-anchor="middle" fill="#333">[ CTA BUTTON ]</text>
  <rect x="230" y="300" width="140" height="34" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="300" y="321" font-size="10" text-anchor="middle" fill="#999">[ ghost btn ]</text>

  <!-- Hero side panel (scoreboard) -->
  <rect x="450" y="175" width="290" height="180" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="595" y="200" font-size="9" text-anchor="middle" fill="#999">"scoreboard" panel</text>
  <line x1="465" y1="220" x2="725" y2="220" stroke="#ccc"/>
  <line x1="465" y1="255" x2="725" y2="255" stroke="#ccc"/>
  <line x1="465" y1="290" x2="725" y2="290" stroke="#ccc"/>
  <line x1="465" y1="325" x2="725" y2="325" stroke="#ccc"/>

  <!-- Feature cards row -->
  <text x="400" y="400" font-size="11" text-anchor="middle" fill="#666">Why S.I.C — 3 feature cards</text>
  <rect x="30" y="415" width="230" height="140" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="285" y="415" width="230" height="140" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="540" y="415" width="230" height="140" fill="none" stroke="#333" stroke-width="1.5"/>
  <g font-size="9" fill="#999">
    <text x="145" y="440" text-anchor="middle">card label</text>
    <text x="400" y="440" text-anchor="middle">card label</text>
    <text x="655" y="440" text-anchor="middle">card label</text>
  </g>

  <!-- Fixtures preview -->
  <text x="400" y="595" font-size="11" text-anchor="middle" fill="#666">Upcoming Screenings — 3 fixture rows</text>
  <rect x="30" y="610" width="740" height="50" fill="none" stroke="#333"/>
  <rect x="30" y="668" width="740" height="50" fill="none" stroke="#333"/>
  <rect x="30" y="726" width="740" height="50" fill="none" stroke="#333"/>

  <!-- Partnership row -->
  <rect x="30" y="790" width="360" height="60" fill="none" stroke="#333" stroke-dasharray="4"/>
  <text x="210" y="825" font-size="9" text-anchor="middle" fill="#999">partnership text block</text>
  <rect x="410" y="790" width="360" height="60" fill="none" stroke="#333" stroke-dasharray="4"/>
  <text x="590" y="825" font-size="9" text-anchor="middle" fill="#999">CTA card</text>

  <!-- Footer -->
  <rect x="30" y="865" width="740" height="25" fill="#eee" stroke="#333"/>
  <text x="400" y="881" font-size="9" text-anchor="middle" fill="#666">footer — links, locations, copyright</text>
</svg>
