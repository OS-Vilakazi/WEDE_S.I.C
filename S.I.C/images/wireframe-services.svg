<svg width="800" height="700" viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="700" fill="#ffffff" stroke="#ccc"/>
  <text x="400" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">Wireframe — Fixtures / Services Page (Low-Fidelity)</text>

  <!-- Header / Nav -->
  <rect x="30" y="50" width="740" height="60" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="45" y="65" width="70" height="30" fill="none" stroke="#333"/>
  <text x="80" y="84" font-size="10" text-anchor="middle" fill="#333">LOGO</text>
  <line x1="180" y1="80" x2="250" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="270" y1="80" x2="340" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="360" y1="80" x2="430" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="450" y1="80" x2="520" y2="80" stroke="#999" stroke-width="6"/>
  <line x1="540" y1="80" x2="610" y2="80" stroke="#999" stroke-width="6"/>

  <!-- Page header -->
  <rect x="30" y="130" width="740" height="90" fill="#eee" stroke="#333"/>
  <line x1="55" y1="160" x2="330" y2="160" stroke="#333" stroke-width="8"/>
  <line x1="55" y1="185" x2="450" y2="185" stroke="#999" stroke-width="4"/>

  <!-- Section: Formula 1 -->
  <line x1="30" y1="250" x2="180" y2="250" stroke="#333" stroke-width="6"/>
  <rect x="30" y="265" width="740" height="60" fill="none" stroke="#333"/>
  <rect x="30" y="330" width="740" height="60" fill="none" stroke="#333"/>
  <rect x="30" y="395" width="740" height="60" fill="none" stroke="#333"/>
  <g font-size="9" fill="#999">
    <text x="70" y="298">tag</text><text x="200" y="298">fixture name + description</text><text x="650" y="298">date / location</text>
  </g>

  <!-- Section: Football -->
  <line x1="30" y1="480" x2="180" y2="480" stroke="#333" stroke-width="6"/>
  <rect x="30" y="495" width="740" height="60" fill="none" stroke="#333"/>
  <rect x="30" y="560" width="740" height="60" fill="none" stroke="#333"/>
  <rect x="30" y="625" width="740" height="60" fill="none" stroke="#333"/>

  <!-- Footer -->
  <rect x="30" y="670" width="740" height="20" fill="#eee" stroke="#333"/>
  <text x="400" y="684" font-size="9" text-anchor="middle" fill="#666">footer</text>
</svg>
