<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">S.I.C — Website Sitemap</text>

  <!-- Root node: Home -->
  <rect x="375" y="55" width="150" height="55" fill="#e4002b" stroke="#111" stroke-width="1.5"/>
  <text x="450" y="88" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Home</text>
  <text x="450" y="103" font-size="10" fill="#fff" text-anchor="middle">index / home.html</text>

  <!-- Vertical line down from Home -->
  <line x1="450" y1="110" x2="450" y2="150" stroke="#333" stroke-width="1.5"/>
  <!-- Horizontal connector -->
  <line x1="65" y1="150" x2="835" y2="150" stroke="#333" stroke-width="1.5"/>

  <!-- Drop lines to each child -->
  <line x1="65" y1="150" x2="65" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="195" y1="150" x2="195" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="325" y1="150" x2="325" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="455" y1="150" x2="455" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="585" y1="150" x2="585" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="715" y1="150" x2="715" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="835" y1="150" x2="835" y2="180" stroke="#333" stroke-width="1.5"/>

  <!-- Child: About -->
  <rect x="0" y="180" width="130" height="55" fill="#1c1f26" stroke="#111" stroke-width="1.5"/>
  <text x="65" y="210" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">About</text>
  <text x="65" y="224" font-size="9" fill="#ccc" text-anchor="middle">about.html</text>

  <!-- Child: Services / Fixtures -->
  <rect x="130" y="180" width="130" height="55" fill="#1c1f26" stroke="#111" stroke-width="1.5"/>
  <text x="195" y="203" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Fixtures</text>
  <text x="195" y="216" font-size="9" fill="#ccc" text-anchor="middle">(Services)</text>
  <text x="195" y="228" font-size="9" fill="#ccc" text-anchor="middle">services.html</text>

  <!-- Child: Gallery -->
  <rect x="260" y="180" width="130" height="55" fill="#1c1f26" stroke="#111" stroke-width="1.5"/>
  <text x="325" y="210" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Gallery</text>
  <text x="325" y="224" font-size="9" fill="#ccc" text-anchor="middle">gallery.html</text>

  <!-- Child: Enquiry -->
  <rect x="390" y="180" width="130" height="55" fill="#1c1f26" stroke="#111" stroke-width="1.5"/>
  <text x="455" y="210" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Enquiry</text>
  <text x="455" y="224" font-size="9" fill="#ccc" text-anchor="middle">enquiry.html</text>

  <!-- Child: Contact -->
  <rect x="520" y="180" width="130" height="55" fill="#1c1f26" stroke="#111" stroke-width="1.5"/>
  <text x="585" y="210" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Contact</text>
  <text x="585" y="224" font-size="9" fill="#ccc" text-anchor="middle">contact.html</text>

  <!-- Grandchild under Contact: Locations -->
  <line x1="650" y1="207" x2="715" y2="207" stroke="#333" stroke-width="1.5"/>
  <rect x="650" y="180" width="130" height="55" fill="#1c1f26" stroke="#111" stroke-width="1.5"/>
  <text x="715" y="202" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Cinema</text>
  <text x="715" y="215" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Locations</text>
  <text x="715" y="228" font-size="8" fill="#ccc" text-anchor="middle">3 x Ster-Kinekor sites</text>

  <!-- Child: 5 gallery photos -->
  <line x1="325" y1="235" x2="325" y2="255" stroke="#333" stroke-width="1.5"/>
  <rect x="260" y="255" width="130" height="45" fill="#333" stroke="#111" stroke-width="1.5"/>
  <text x="325" y="278" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">5 photos</text>
  <text x="325" y="291" font-size="8" fill="#ccc" text-anchor="middle">images/gallery-1..5.jpg</text>

  <!-- Legend -->
  <rect x="55" y="335" width="18" height="18" fill="#e4002b"/>
  <text x="80" y="349" font-size="12" fill="#333">Homepage (entry point, linked from every page)</text>

  <rect x="55" y="365" width="18" height="18" fill="#1c1f26"/>
  <text x="80" y="379" font-size="12" fill="#333">Content page (reachable from the main navigation on every page)</text>

  <text x="55" y="405" font-size="12" fill="#555">Note: navigation is flat — every page links to every other page via the persistent header menu.</text>
  <text x="55" y="420" font-size="12" fill="#555">The Contact page lists three Ster-Kinekor cinema locations; the Gallery page has room for 5 photos.</text>
</svg>
