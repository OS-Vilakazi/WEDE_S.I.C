<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery page</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="color: white; font-family: Arial, Helvetica, sans-serif; margin: 0;">

    <!-- ============================================================
         HEADER — same structure as home.html, "Gallery" link highlighted
         ============================================================ -->
 <header>
    <section class="top-nav">
        <!-- Site Logo -->
        <div>
            <img src="images/logo.jpg" alt="S.I.C Logo" style="height: 35px; width: auto; display: block;">
        </div>

        <!-- Hidden Checkbox & Hamburger Icon -->
        <input id="menu-toggle" type="checkbox" />
        <label class='menu-button-container' for="menu-toggle">
            <div class='menu-button'></div>
        </label>

        <!-- Navigation Links -->
        <ul class="menu">
            <li><a href="home.html" class="nav-link active">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="services.html" class="nav-link">Services</a></li>
            <li><a href="gallery.html" class="nav-link">Gallery</a></li>
            <li><a href="enquiry.html" class="nav-link">Enquire</a></li>
            <li><a href="contact.html" class="nav-link active-page">Contact us</a></li>
        </ul>
    </section>
</header>

    <main style="padding: 40px;">

        <h1>Gallery</h1>
        <p style="max-width: 700px; color: lightgray;">
            A look at the S.I.C big-screen experience — screenings, crowds, and cinema
            atmosphere from past events at Ster-Kinekor.
        </p>

        <!-- ============================================================
             PHOTO GRID
             Room for 5 photos. Each box is a fixed-size placeholder using
             an <img> tag — replace the src with a real photo filename in
             the images folder (e.g. images/gallery-1.jpg) once available.
             ============================================================ -->
        <table style="width: 100%; margin-top: 30px; border-spacing: 15px;">
            <tr>
                <td style="width: 33%;">
                    <img src="images/gallery-1.jpg" alt="S.I.C screening photo 1"
                         style="width: 100%; height: 220px; object-fit: cover; background-color: black; border: 2px solid gray; display: block;">
                </td>
                <td style="width: 33%;">
                    <img src="images/gallery-2.jpg" alt="S.I.C screening photo 2"
                         style="width: 100%; height: 220px; object-fit: cover; background-color: black; border: 2px solid gray; display: block;">
                </td>
                <td style="width: 33%;">
                    <img src="images/gallery-3.jpg" alt="S.I.C screening photo 3"
                         style="width: 100%; height: 220px; object-fit: cover; background-color: black; border: 2px solid gray; display: block;">
                </td>
            </tr>
            <tr>
                <td style="width: 33%;">
                    <img src="images/gallery-4.jpg" alt="S.I.C screening photo 4"
                         style="width: 100%; height: 220px; object-fit: cover; background-color: black; border: 2px solid gray; display: block;">
                </td>
                <td style="width: 33%;">
                    <img src="images/gallery-5.jpg" alt="S.I.C screening photo 5"
                         style="width: 100%; height: 220px; object-fit: cover; background-color: black; border: 2px solid gray; display: block;">
                </td>
                <td style="width: 33%;"></td>
            </tr>
        </table>

    </main>

    <!-- Footer — copyright notice, same on every page -->
    <footer style="background-color: black; color: white; text-align: center; padding: 20px;">
        &copy; ST10537650#Sport's in Cinema
    </footer>

</body>
</html>
